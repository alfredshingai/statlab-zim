services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: statlab
      POSTGRES_PASSWORD: statlabpass
      POSTGRES_DB: statlab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statlab"]
      interval: 5s
      timeout: 2s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://statlab:statlabpass@db:5432/statlab
      SECRET_KEY: change-me-in-production
      ENVIRONMENT: production
      DEBUG: "false"
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/statlab.db:/app/backend/statlab.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
