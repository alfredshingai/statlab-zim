# Render blueprint — free tier backend for StatLab Zim
# Deploy via: Render Dashboard → New → Blueprint → connect repo → Apply
# Requires: Supabase DATABASE_URL (see docs/deploy-free.md)

services:
  - type: web
    name: statlab-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # Render sets PORT automatically; Dockerfile CMD uses ${PORT:-8000} (no startCommand for docker runtime)
    envVars:
      - key: PYTHONPATH
        value: /app:/app/backend
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        # Set in Render dashboard → paste Supabase pooled URL
        # Example: postgresql+psycopg2://postgres.<ref>:<password>@aws-0-eu-central-1.pooler.supabase.com:6543/postgres
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        # Set after Vercel deploy, e.g. https://statlab-zim.vercel.app,http://localhost:5173
        sync: false
      - key: VITE_API_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true
